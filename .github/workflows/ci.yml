name: ARM64 build

# Builds the ReXGlue SDK the way Saints Reborn uses it (its pinned commit and
# patches/rexglue-sdk.patch, plus patches/sdk/) for linux-arm64 with the
# Vulkan backend, then Saints Reborn itself (patches/game/) against it, two
# ways: natively on GitHub's ARM64 runner in a bare Fedora 44 (the release
# ArmadaOS is built on) with only the pinned toolchain, as a handheld would,
# and cross-compiled on x86-64 Ubuntu as a PC or WSL would. Then it checks the
# guest memory safety net, natively and under qemu.
#
# No game files are involved: the game is built with placeholder recompiled
# code (scripts/placeholder-codegen.py), which checks that everything
# compiles and links but does not make a game that runs. The launcher
# (launcher/) is built on the ARM64 runner too, and its window opened on a
# virtual screen.

on:
  # Every branch: work reaches main without pull requests, once this is green.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Saints Reborn commit or branch (default the one in upstream.json)
        required: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 120
    steps:
      # No compilers, CMake or development files, as on ArmadaOS: the pinned
      # toolchain and sysroot bring them. The SDK's runtime loads the X11 and
      # Wayland client libraries, which a desktop like ArmadaOS has.
      - name: Install git, Python, the download tools and the desktop libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False git python3 curl tar xz
          libX11 libX11-xcb libxcb libwayland-client
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out Saints Reborn and the patched SDK
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the SDK
        run: scripts/build-sdk.sh "$RUNNER_TEMP/work/rexglue-sdk" "$RUNNER_TEMP/toolchain"
      - name: Build the game with placeholder recompiled code
        run: |
          scripts/placeholder-codegen.py "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk" "$RUNNER_TEMP/generated"
          scripts/build-game.sh "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk/out/install/linux-arm64" \
            "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/generated"
      - name: Check the guest memory safety net
        run: |
          scripts/test-safety-net.sh "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk/out/install/linux-arm64" \
            "$RUNNER_TEMP/toolchain"
      - name: Check Add to Steam with a made-up Steam folder
        run: |
          python3 tests/add_to_steam_test.py
          ln -sfn "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/work/toolchain"
          mkdir -p "$RUNNER_TEMP/work/SaintsReborn/dist" "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config"
          touch "$RUNNER_TEMP/work/SaintsReborn/dist/saintsrow"
          HOME="$RUNNER_TEMP/home" scripts/add-to-steam.sh "$RUNNER_TEMP/work"
          ls -l "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/grid"
          test "$(ls "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/grid" | wc -l)" = 5

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install CMake, Ninja, wayland-scanner and qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build pkgconf libwayland-bin qemu-user-static file
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out Saints Reborn and the patched SDK
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the SDK
        run: scripts/build-sdk.sh "$RUNNER_TEMP/work/rexglue-sdk" "$RUNNER_TEMP/toolchain"
      - name: Build the game with placeholder recompiled code
        run: |
          scripts/placeholder-codegen.py "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk" "$RUNNER_TEMP/generated"
          scripts/build-game.sh "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk/out/install/linux-arm64" \
            "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/generated"
      - name: Check the guest memory safety net
        run: |
          scripts/test-safety-net.sh "$RUNNER_TEMP/work/SaintsReborn" "$RUNNER_TEMP/work/rexglue-sdk/out/install/linux-arm64" \
            "$RUNNER_TEMP/toolchain"
      - name: Check Add to Steam with a made-up Steam folder
        run: |
          python3 tests/add_to_steam_test.py
          ln -sfn "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/work/toolchain"
          mkdir -p "$RUNNER_TEMP/work/SaintsReborn/dist" "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config"
          touch "$RUNNER_TEMP/work/SaintsReborn/dist/saintsrow"
          HOME="$RUNNER_TEMP/home" scripts/add-to-steam.sh "$RUNNER_TEMP/work"
          ls -l "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/grid"
          test "$(ls "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/grid" | wc -l)" = 5

  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust, and a virtual screen with OpenGL for the window
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test and build the launcher
        run: |
          cargo test --release --locked --manifest-path launcher/Cargo.toml
          scripts/package-launcher.sh out
          tar -tzvf out/SaintsReborn-Launcher-linux-arm64.tar.gz
      - name: Open the launcher window
        run: |
          # Still open after 10 seconds (timeout ends it with 124): it started.
          status=0
          HOME="$RUNNER_TEMP/home" xvfb-run -a -s "-screen 0 860x620x24" \
            timeout 10 launcher/target/release/saintsreborn-launcher || status=$?
          test "$status" = 124
