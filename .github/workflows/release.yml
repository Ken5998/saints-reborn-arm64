name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files and no build
# scripts: on the device it fetches this repository's scripts and patches and
# builds the game from the player's own disc.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/SaintsReborn-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          The Saints Reborn launcher $version for ARM64 Linux handhelds, such as the Retroid Pocket 6 on ArmadaOS.

          On the device, in Desktop Mode: unpack SaintsReborn-Launcher-linux-arm64.tar.gz, start SaintsReborn/saintsreborn-launcher and choose your own Saints Row (Xbox 360) disc image. It fetches this repository's scripts and patches, builds the game on the device (about 40 GB free; keep it on the charger) and adds it to Steam with its artwork. Update gets the latest fixes later. It needs git, Python 3, curl, tar and xz on the device, as ArmadaOS has.

          No game files are included. SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Saints Reborn launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
