name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files and no build
# scripts: on the device it fetches this repository's scripts and patches and
# builds the game from the player's own disc.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/SaintsReborn-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Getting Stilwater on the handheld

          Unpack SaintsReborn-Launcher-linux-arm64.tar.gz in Desktop Mode and run SaintsReborn/saintsreborn-launcher. It finds your Saints Row (Xbox 360) disc image in Downloads, a ROM folder or the SD card by itself; press **Build** and the recompiled game is compiled on the device. Leave it on the charger with about 40 GB free. When it is done, Saints Reborn is waiting in your Steam library.

          Built before? **Update** rebuilds only what changed and doesn't read the disc again.

          The game holds its own 30 fps at 1280 x 720 with GPU Tweaks (OPTIONS > DISPLAY, on by default). If MangoHud or the Steam overlay flickers, **Turn it off** in the launcher disables GPU preemption. Online co-op and Lua code hooks are not in this build yet.

          Launcher SHA-256: \`$sha256\`. Bring your own disc: nothing from the game ships here.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Saints Reborn launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
